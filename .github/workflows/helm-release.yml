name: Helm Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false

jobs:
  read-versions:
    runs-on: ubuntu-24.04
    outputs:
      operator_image_tag: ${{ steps.versions.outputs.operator_image_tag }}
      server_image_tag: ${{ steps.versions.outputs.server_image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Read versions from values.yaml
        id: versions
        run: |
          OPERATOR_TAG=$(yq '.operator.image.tag' infra/helm-diom/values.yaml)
          SERVER_TAG=$(yq '.cluster.image.tag' infra/helm-diom/values.yaml)
          echo "Releasing helm chart with:"
          echo "  operator image tag: ${OPERATOR_TAG}"
          echo "  server image tag:   ${SERVER_TAG}"

  publish:
    needs: read-versions
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/helm-publish.yml
    with:
      is_release: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
