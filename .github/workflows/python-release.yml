name: Python Release

on:
  workflow_dispatch:
  workflow_call:
  workflow_run:
    workflows:
      - Mega Releaser
    types:
      - completed

jobs:
  build:
    permissions:
      id-token: write
    name: Build distributions
    runs-on: ubuntu-24.04
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build distributions
        run: uv build --clear
        working-directory: z-clients/python

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: z-clients/python/dist
