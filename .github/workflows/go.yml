name: Go

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Go SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: z-clients/go
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build
      - run: go test
