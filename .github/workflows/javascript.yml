name: JavaScript

on:
  workflow_dispatch:
  workflow_call:

jobs:
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: z-clients/javascript
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run bundle
      - run: npm test
