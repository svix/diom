name: SDK Integration Tests

on:
  workflow_dispatch:
  workflow_call:

env:
  DIOM_ADMIN_TOKEN: admin_abcdefghijlmnopqrstuvwxyz012345

jobs:
  build-server:
    name: Build Server Binary
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '1.97.1'
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build server binary
        run: |
          cargo build --package diom-server --bin diom-server
          strip target/debug/diom-server
      - uses: actions/upload-artifact@v7
        with:
          name: diom-server-binary
          path: target/debug/diom-server
          retention-days: 1

  test-rust:
    name: Rust SDK (${{ matrix.rust }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust SDK integration tests
        run: scripts/test-sdk.sh rust
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-python:
    name: Python SDK (${{ matrix.python-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python SDK integration tests
        run: scripts/test-sdk.sh python
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-javascript:
    name: JavaScript SDK (Node ${{ matrix.node-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run JavaScript SDK integration tests
        run: scripts/test-sdk.sh javascript
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-go:
    name: Go SDK (${{ matrix.go-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run Go SDK integration tests
        run: scripts/test-sdk.sh go
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-java:
    name: Java SDK (${{ matrix.java-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run Java SDK integration tests
        run: scripts/test-sdk.sh java
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh
