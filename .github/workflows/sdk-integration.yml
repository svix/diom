name: SDK Integration Tests

on:
  workflow_dispatch:
  workflow_call:

env:
  DIOM_ADMIN_TOKEN: admin_abcdefghijlmnopqrstuvwxyz012345
  # Keep this in sync with Dockerfile
  ci_toolchain_rust: '1.98.1'

jobs:
  build-server:
    name: Build Server Binary
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "sdk-server-${{ env.ci_toolchain_rust }}"
      - name: Build server binary
        run: |
          cargo build --package diom-server --bin diom-server
          strip target/debug/diom-server
      - uses: actions/upload-artifact@v7
        with:
          name: diom-server-binary
          path: target/debug/diom-server
          retention-days: 1

  test-rust:
    name: Rust SDK (${{ matrix.rust }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "sdk-rust-${{ matrix.rust }}"
      - name: Run Rust SDK integration tests
        run: scripts/test-sdk.sh rust
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-python:
    name: Python SDK (${{ matrix.python-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy@3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python SDK integration tests
        run: scripts/test-sdk.sh python
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-javascript:
    name: JavaScript SDK (Node ${{ matrix.node-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run JavaScript SDK integration tests
        run: scripts/test-sdk.sh javascript
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-go:
    name: Go SDK (${{ matrix.go-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run Go SDK integration tests
        run: scripts/test-sdk.sh go
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh

  test-java:
    name: Java SDK (${{ matrix.java-version }})
    needs: build-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: diom-server-binary
          path: /tmp
      - name: Start Diom server
        run: scripts/start-diom-server.sh /tmp/diom-server
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run Java SDK integration tests
        run: scripts/test-sdk.sh java
      - name: Stop server
        if: always()
        run: scripts/stop-diom-server.sh
