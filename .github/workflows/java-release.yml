name: Java Release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Java Release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v7.0.1

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: 'central'
          server-username-env-var: NEXUS_USERNAME
          server-password-env-var: NEXUS_PASSWORD
          gpg-passphrase-env-var: GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}

      - name: Build & Deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn -P release deploy -DskipITs
        working-directory: z-clients/java
