name: Diom CI

on:
  workflow_dispatch:
    inputs:
      run_operator_e2e:
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_operator_e2e:
        type: boolean
        default: true

# When pushing to a PR, cancel any jobs still running for the previous head commit of the PR
concurrency:
  # head_ref is only defined for pull requests, run_id is always unique and defined so if this
  # workflow was not triggered by a pull request, nothing gets cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_WARNINGS: deny
  # Keep this in sync with Dockerfile
  ci_toolchain_rust: '1.98.1'

jobs:
  check-fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt -- --check

  check-manifests:
    name: Check cargo manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-sort@2.1.3
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-machete
      - run: cargo sort --check --no-format --workspace -o package,lib,bin,features,dependencies,build-dependencies,dev-dependencies,lints,workspace
      - run: cargo machete

  clippy:
    name: Clippy
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      # Use beta toolchain for a middle ground between effective caching and the latest lints
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "clippy"
      # don't use --all-features as enabling both TLS backends for the SDK results in warnings
      # because of hyper-tls ending up unused.
      - run: cargo clippy --workspace --all-targets --features generate,openapi,operator-e2e,tokio-console

  prek:
    name: Validate prek
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: j178/prek-action@v3.1.0
      - name: Verify the workflow lockfile
        uses: j178/prek-action@v3.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: "--hook-stage manual gh-actions-lock-verify --all-files"

  test:
    name: Test
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 15
    env:
      DIOM_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "test-${{ env.ci_toolchain_rust }}"
      - name: Run tests
        id: test
        run: bash .github/test-report.sh
      - name: Upload Test Report
        uses: actions/upload-artifact@v7.0.2
        id: upload-report
        if: always()
        with:
          name: test-report
          path: |
            ./junit.xml
            ./coverage.json
            ./coverage-html
          retention-days: 7

  check-codegen:
    name: Check openapi.json, SDK, and default config freshness
    runs-on: ubicloud-standard-4-ubuntu-2404
    env:
      CODEGEN_OCI_RUNNER: docker
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "codegen-${{ env.ci_toolchain_rust }}"
      - name: Regerate openapi.json and SDKs
        run: cargo codegen
      - name: Regerate config.defaults.toml
        run: cargo run -- write-config config.defaults.toml
      - name: Regerate ENVIRONMENT_VARIABLES.md
        run: cargo run -- describe-environment-variables ENVIRONMENT_VARIABLES.md
      - name: Check for uncommitted changes
        run: |
          gs=$(git status -s)
          if [[ -n "$gs" ]]; then
            echo 'there are uncommitted changes!'
            # `cargo codegen` is not meant to be executed here 😒
            # shellcheck disable=SC2016
            echo 'please rerun `cargo codegen` and commit the result'
            git status
            exit 1
          else
            echo 'all good.'
          fi

  sdk-integration:
    uses: ./.github/workflows/sdk-integration.yml

  helm-test:
    name: Helm chart unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
      - name: Run Helm unit tests
        run: helm unittest ./infra/helm-diom

  check-crd:
    name: Check CRD JSON freshness
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "check-crd-${{ env.ci_toolchain_rust }}"
      - name: Regenerate CRD JSON
        run: cargo run -p diom-operator -- --print-crd-json > infra/helm-diom/charts/crds/crds/diomclusters.json
      - name: Check for uncommitted changes
        run: |
          gs=$(git status -s)
          if [[ -n "$gs" ]]; then
            echo 'CRD JSON is out of date!'
            # shellcheck disable=SC2016
            echo 'please run `cargo run -p diom-operator -- --print-crd-json` and commit the result'
            git diff
            exit 1
          else
            echo 'all good.'
          fi

  operator-e2e:
    name: Operator e2e tests
    if: ${{ inputs.run_operator_e2e }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    continue-on-error: true
    timeout-minutes: 20
    env:
      DIOM_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # include relevant information in the cache name
          prefix-key: "operator-e2e-${{ env.ci_toolchain_rust }}"
      - uses: helm/kind-action@v1.15.1
      - name: Run operator e2e tests
        run: cargo test -p diom-operator --features operator-e2e

  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: Cargo.toml
