name: Diom CI
on:
  workflow_dispatch:
    inputs:
      run_operator_e2e:
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_operator_e2e:
        type: boolean
        default: true
# When pushing to a PR, cancel any jobs still running for the previous head commit of the PR
concurrency:
  # head_ref is only defined for pull requests, run_id is always unique and defined so if this
  # workflow was not triggered by a pull request, nothing gets cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_WARNINGS: deny
  # Keep this in sync with Dockerfile
  ci_toolchain_rust: '1.97.1'

jobs:
  check-fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt -- --check
  check-manifests:
    name: Check cargo manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-sort
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-machete
      - run: cargo sort --check --no-format --workspace -o package,lib,bin,features,dependencies,dev-dependencies,lints,workspace
      - run: cargo machete
  clippy:
    name: Clippy
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # Use beta toolchain for a middle ground between effective caching and the latest lints
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: beta
          components: clippy
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          # only save the cache on the main branch
          # cf https://github.com/Swatinem/rust-cache/issues/95
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-features --all-targets
  prek:
    name: Validate prek
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
  test:
    name: Test
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 15
    env:
      DIOM_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-nextest
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        id: test
        run: bash .github/test-report.sh
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        id: upload-report
        if: always()
        with:
          name: test-report
          path: |
            ./junit.xml
            ./coverage-html
          retention-days: 7
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: ${{ always() && github.ref != 'refs/heads/main' }}
        with:
          report_paths: './junit.xml'
          comment: true
          check_retries: true
          job_summary: true
          detailed_summary: true
          verbose_summary: false
          fail_on_parse_error: true
          include_time_in_summary: true
          group_suite: true
          skip_annotations: true
          check_name: 'Diom CI JUnit'
          job_name: 'Diom CI'
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        if: github.ref != 'refs/heads/main'
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Test Coverage:'
      - name: Upsert comment
        if: github.ref != 'refs/heads/main'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Test Coverage: ${{ steps.test.outputs.coverage_percent }}%

            [Artifact download](${{ steps.upload-report.outputs.artifact-url}})
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
  check-codegen:
    name: Check openapi.json, SDK, and default config freshness
    runs-on: ubicloud-standard-4-ubuntu-2404
    env:
      CODEGEN_OCI_RUNNER: docker
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
          components: rustfmt
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regerate openapi.json and SDKs
        run: cargo codegen
      - name: Regerate config.defaults.toml
        run: cargo run -- write-config config.defaults.toml
      - name: Regerate ENVIRONMENT_VARIABLES.md
        run: cargo run -- describe-environment-variables ENVIRONMENT_VARIABLES.md
      - name: Check for uncommitted changes
        run: |
          gs=$(git status -s)
          if [[ -n "$gs" ]]; then
            echo 'there are uncommitted changes!'
            # `cargo codegen` is not meant to be executed here 😒
            # shellcheck disable=SC2016
            echo 'please rerun `cargo codegen` and commit the result'
            git status
            exit 1
          else
            echo 'all good.'
          fi
  sdk-integration:
    uses: ./.github/workflows/sdk-integration.yml
  helm-test:
    name: Helm chart unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
      - name: Run Helm unit tests
        run: helm unittest ./infra/helm-diom
  check-crd:
    name: Check CRD JSON freshness
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regenerate CRD JSON
        run: cargo run -p diom-operator -- --print-crd-json > infra/helm-diom/charts/crds/crds/diomclusters.json
      - name: Check for uncommitted changes
        run: |
          gs=$(git status -s)
          if [[ -n "$gs" ]]; then
            echo 'CRD JSON is out of date!'
            # shellcheck disable=SC2016
            echo 'please run `cargo run -p diom-operator -- --print-crd-json` and commit the result'
            git diff
            exit 1
          else
            echo 'all good.'
          fi
  operator-e2e:
    name: Operator e2e tests
    if: ${{ inputs.run_operator_e2e }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    continue-on-error: true
    timeout-minutes: 20
    env:
      DIOM_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - name: Run operator e2e tests
        run: cargo test -p diom-operator --features operator-e2e
  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
