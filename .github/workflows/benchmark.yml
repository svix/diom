name: Diom CI
on:
  workflow_dispatch:
  workflow_call:
jobs:
  benchmark:
    name: Benchmark
    timeout-minutes: 15
    runs-on: ubicloud-standard-8-ubuntu-2404
    defaults:
      run:
        working-directory: ./benchmarks
    steps:
      - uses: actions/checkout@v7
      # librdkafka (rdkafka-sys) is built from source via cmake and links system OpenSSL, zlib and
      # libcurl (curl is pulled in by librdkafka's SASL OAUTHBEARER/OIDC support).
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: '1.97.1'
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2.7.5
      - name: Install cargo-criterion
        run: cargo install cargo-criterion
      - name: Run benchmarks
        # For some weird reason, it seems to log test output
        # to stderr:
        run: cargo criterion --output-format bencher 2>&1 | tee output.txt
      - name: Download previous benchmark data
        uses: actions/cache@v6.1.0
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'cargo'
          output-file-path: ./benchmarks/output.txt
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          fail-on-alert: true
