name: Benchmarks

on:
  workflow_dispatch:
  workflow_call:

env:
  # Keep this in sync with server/ee.Dockerfile
  ci_toolchain_rust: "1.98.1"

jobs:
  benchmark:
    name: Benchmark
    timeout-minutes: 15
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    defaults:
      run:
        working-directory: ./benchmarks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.ci_toolchain_rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # include relevant information in the cache name
          prefix-key: "benchmarks-${{ env.ci_toolchain_rust }}"
      - name: Build the benchmarks
        run: cargo codspeed build
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: cargo codspeed run
