crds:
  # Install the DiomCluster CRD. If not enabled, you will
  # need to manage installing the CRD yourself.
  enabled: true
  # Run a pre-install/pre-upgrade Job that applies the CRD via
  # `kubectl apply --server-side`, enabling automatic CRD schema upgrades.
  # See charts/crds/values.yaml for full configuration options.
  upgrade:
    enabled: false
    forceConflicts: false

operator:
  image:
    repository: svix/diom-operator
    pullPolicy: IfNotPresent
    tag: "0.3.0"

  imagePullSecrets: []

  serviceAccount:
    create: true
    # If not set, defaults to the fullname of the release.
    name: ""
    annotations: {}

  rbac:
    create: true

  # logLevel: info
  # logFormat: default

  extraEnv: []

  podAnnotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

# Definition for the DiomCluster resource managed by the operator.
cluster:
  enabled: true
  name: diom
  image:
    repository: svix/diom-server
    # tag is required when cluster.enabled=true.
    tag: "0.2.4"
  spec:
    replicas: 3
    service:
      type: ClusterIP
      # annotations: {}
    storage:
      persistent:
        size: 10Gi
    # envVar: []
    # nodeSelector: {}
    # tolerations: []
    # probes:
    #   liveness:
    #     initialDelaySeconds: 5
    #     periodSeconds: 10
    #     failureThreshold: 2
    #     successThreshold: 1
